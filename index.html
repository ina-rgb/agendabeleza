<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#c4517a">
<title>Agenda de Beleza</title>
<meta name="description" content="Agenda, clientes, pacotes e financeiro da manicure e depiladora, num só lugar.">
<meta property="og:title" content="Agenda de Beleza">
<meta property="og:description" content="Agenda, clientes, pacotes e financeiro de unhas e depilação, num só lugar. 💅">
<meta property="og:image" content="https://ina-rgb.github.io/agendabeleza/og.jpg">
<meta property="og:url" content="https://ina-rgb.github.io/agendabeleza/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Agenda de Beleza">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap">
<style>
:root{--c:#c4517a;--dark:color-mix(in srgb,var(--c) 72%,black);--soft:color-mix(in srgb,var(--c) 12%,#fffdf8);--soft2:color-mix(in srgb,var(--c) 22%,#fffdf8);--line:color-mix(in srgb,var(--c) 18%,#ece6da);--ink:#23302a;--muted:#6b7570;--gold:#b88739;--ok:#3f8a4e;--warn:#c38922;--bad:#b3261e;color-scheme:light}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at top left,var(--soft2),transparent 60%),#fbfaf6;min-height:100vh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit}
input,select,textarea{display:block;width:100%;margin-top:6px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);min-width:0}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:14px;margin:12px 0;font-weight:600}
label small{font-weight:400;color:var(--muted)}
button{cursor:pointer;border:0;border-radius:14px;padding:12px 16px;background:linear-gradient(135deg,var(--dark),var(--c));color:#fff;font-weight:600}
button.light{background:var(--soft);color:var(--dark);border:1px solid var(--line)}
button.white{background:#fff;color:var(--dark);border:1px solid var(--line)}
button.danger{background:#fff;color:var(--bad);border:1px solid #e9c9c6}
button.mini{padding:7px 10px;font-size:13px;border-radius:10px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid color-mix(in srgb,var(--c) 45%,white);outline-offset:2px}
a.btn{display:block;text-align:center;text-decoration:none;border-radius:14px;padding:13px 16px;font-weight:600;background:linear-gradient(135deg,var(--dark),var(--c));color:#fff}
a.btn.light{background:var(--soft);color:var(--dark);border:1px solid var(--line)}
.full{display:block;width:100%;margin:8px 0}
.micBtn{font-size:20px;padding:18px;margin:12px 0 4px;border-radius:18px}
.micBtn.on{background:var(--bad);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 #b3261e55}50%{box-shadow:0 0 0 12px #b3261e00}}
.notice{font-size:11px;background:var(--soft2);color:var(--dark);padding:5px;text-align:center}
#storageWarn{background:var(--bad);color:#fff;padding:12px;text-align:center;font-size:14px}
header{max-width:580px;margin:auto;background:linear-gradient(140deg,var(--dark),var(--c));color:#fff;border-radius:0 0 34px 34px;padding:22px 20px 28px;display:flex;align-items:center;gap:14px;justify-content:center;box-shadow:0 6px 20px #0002;position:relative}
.brandIcon{width:58px;height:58px;border-radius:50%;background:#fff;display:grid;place-items:center;flex-shrink:0;color:var(--c);overflow:hidden}
.brandIcon img{width:100%;height:100%;object-fit:contain}
.brandIcon svg{width:44px;height:44px}
.brandIcon svg.av{width:100%;height:100%}
.tileImg svg.av{width:110px;height:110px;border-radius:50%}
.tileImg svg.coverArt{width:100%;height:auto;margin:0}
header h1{margin:0;font-family:'Dancing Script',Georgia,serif;font-weight:700;font-size:36px;line-height:1.05}
header small{display:block;letter-spacing:2px;font-size:11px;opacity:.85;text-transform:uppercase}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.hbadge{font-size:10px;background:#ffffff26;border-radius:20px;padding:3px 9px;color:#fff;border:0;font-weight:600}
main{max-width:580px;margin:auto;padding:16px 14px 120px}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);max-width:550px;width:calc(100% - 20px);z-index:10;background:#fffdf8ee;border:1px solid var(--line);border-radius:23px;box-shadow:0 3px 24px #0002;padding:7px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;backdrop-filter:blur(12px)}
nav button{background:transparent;color:var(--dark);padding:7px 2px;font-size:11px;border-radius:16px}
nav button.active{background:var(--soft2)}
.navIcon{display:block;font-size:22px;line-height:26px;margin-bottom:2px}
h2{font-family:Georgia,serif;font-size:25px;margin:8px 0 12px;color:var(--dark)}
h3{font-size:17px;margin:0 0 8px}
.card{background:linear-gradient(135deg,#fff,var(--soft));border:1px solid var(--line);border-radius:20px;padding:18px;margin:12px 0;box-shadow:0 3px 9px #0000000a}
.muted{color:var(--muted)}
.small{font-size:13px}
.center{text-align:center}
.welcome{text-align:center;font-family:Georgia,serif;font-size:20px;line-height:1.35;margin:4px 0 14px;color:var(--dark)}
.cover{display:block;width:100%;border-radius:18px;margin:2px 0 14px;max-height:200px;object-fit:cover;box-shadow:0 4px 14px #0001;background:var(--soft)}
.coverArt{width:100%;border-radius:18px;margin:2px 0 14px;background:linear-gradient(160deg,var(--soft2),#fffdf8);color:var(--c);display:block}
.shortcuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:6px}
.shortcuts button{background:#fffdf8;color:var(--dark);border:1px solid var(--line);border-radius:16px;padding:10px 2px;font-size:11.5px;line-height:1.2;box-shadow:0 3px 8px #0000000d}
.scIcon{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 6px;border-radius:13px;background:var(--soft2);font-size:22px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.row>.tag{flex:0 0 auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tag{display:inline-block;background:var(--soft2);color:var(--dark);border-radius:8px;padding:2px 7px;font-size:12px;font-weight:600;margin:2px 2px 0 0}
.tag.ok{background:#e2efd9;color:#2f6b3a}.tag.warn{background:#fff1ce;color:#7a5512}.tag.bad{background:#f6dedb;color:#8d2a22}.tag.grey{background:#ece9e3;color:#6b6b6b}
.houseRow{display:flex;gap:12px;align-items:center;cursor:pointer;width:100%;background:none;color:inherit;padding:0;text-align:left;border-radius:0;font-weight:400}
.avatar{width:54px;height:54px;border-radius:50%;background:var(--soft2);color:var(--c);display:grid;place-items:center;font-family:Georgia,serif;font-size:24px;font-weight:700;flex-shrink:0;border:3px solid #fff}
.houseRow strong{font-family:Georgia,serif;font-size:19px;display:block}
.chev{color:#a9b3ad;font-size:24px}
.dayNav{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:center}
.dayNav b{font-family:Georgia,serif;font-size:18px;color:var(--dark)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.week button{background:#fff;color:var(--ink);border:1px solid var(--line);padding:6px 0;font-size:11px;border-radius:12px;font-weight:600}
.week button.on{background:var(--c);color:#fff}
.week button i{display:block;font-style:normal;font-size:15px}
.week button em{display:block;font-style:normal;font-size:10px;color:inherit;opacity:.75}
.period{margin-top:12px}
.periodHead{font-weight:700;color:var(--dark);font-size:14px;margin-bottom:6px;display:flex;justify-content:space-between}
.visit{background:#fff;border:1px solid var(--line);border-left:5px solid var(--c);border-radius:14px;padding:12px;margin-bottom:8px}
.visit.done{border-left-color:var(--ok);opacity:.8}
.visit.off{border-left-color:#bbb;opacity:.7}
.visit.rep{border-left-color:var(--warn)}
.visit .vTop{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.visit .vTop strong{font-size:17px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.actions button{padding:10px 6px;font-size:13.5px}
.actions .wide{grid-column:1/-1}
.dots{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.dots i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#ece9e3;color:#777;font-style:normal;font-size:12px;font-weight:700}
.dots i.done{background:var(--ok);color:#fff}.dots i.bad{background:#d9d4cc;color:#8a8a8a}.dots i.rep{background:#f3d58e;color:#6d4d0e}.dots i.next{background:var(--soft2);color:var(--dark)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 2px}
.stats b{display:block;font-size:20px;color:var(--dark)}
.stats small{font-size:11px;color:var(--muted)}
.money{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.money:last-child{border-bottom:0}
.money b{font-size:17px}
.lock{background:repeating-linear-gradient(135deg,#fff,#fff 10px,var(--soft) 10px,var(--soft) 20px);border:1px dashed color-mix(in srgb,var(--c) 45%,#ccc);border-radius:18px;padding:16px;margin:12px 0;text-align:center}
.lock .lk{font-size:28px}
.lock b{display:block;color:var(--dark);font-family:Georgia,serif;font-size:18px;margin:4px 0}
.menuList{display:grid;gap:8px}
.menuTile{display:flex;align-items:center;gap:12px;background:#fffdf8;color:var(--ink);border:1px solid var(--line);text-align:left;padding:14px;border-radius:16px;font-weight:400}
.menuTile .mIc{font-size:24px;width:44px;height:44px;display:grid;place-items:center;background:var(--soft2);border-radius:13px;flex-shrink:0}
.menuTile b{display:block;font-size:16px}
.menuTile small{color:var(--muted)}
.menuTile .chev{margin-left:auto}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{height:62px;border-radius:14px;color:#fff;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:3px solid transparent}
.sw.on{border-color:#222}
.tileImg{display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;min-height:110px;margin-bottom:10px;padding:8px;color:var(--c)}
.tileImg img{max-height:140px;max-width:100%;border-radius:10px}
.tileImg svg{width:90px;height:90px}
.fileBtn{display:block;text-align:center;border-radius:14px;padding:13px;background:linear-gradient(135deg,var(--dark),var(--c));color:#fff;font-weight:600;cursor:pointer;margin:0}
.daysGrid{display:grid;gap:6px}
.dayRows{display:grid;gap:6px;margin:6px 0}
.dayRow{display:grid;grid-template-columns:38px repeat(4,1fr);gap:4px;align-items:center}
.dayRow b{color:var(--dark);font-size:14px}
.pchip{position:relative;margin:0}
.pchip input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.pchip span{display:block;text-align:center;padding:10px 0;border:1.5px solid var(--line);border-radius:11px;background:#fff;font-size:12px;font-weight:600;color:var(--dark);white-space:nowrap}
.pchip input:checked+span{background:var(--c);color:#fff;border-color:var(--c)}
.pchip input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--c) 45%,white)}
.filterBar{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 4px}
.filterBar button{background:#fff;color:var(--dark);border:1.5px solid var(--line);padding:11px 4px;font-size:14px}
.filterBar button.on{background:var(--c);color:#fff;border-color:var(--c)}
.stats .statBtn{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 2px;color:inherit;font-weight:400}
.stats .statBtn.on{border-color:var(--c);background:var(--soft2)}
.dayBoxes{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin:4px 0 6px}
.dayBox{position:relative;margin:0}
.dayBox input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.dayBox span{display:block;text-align:center;padding:12px 0;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:13px;font-weight:700;color:var(--dark)}
.dayBox input:checked+span{background:var(--c);color:#fff;border-color:var(--c)}

.dayBox input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--c) 45%,white)}
.dayLine{display:grid;grid-template-columns:60px 1fr;gap:8px;align-items:center}
.dayLine span{font-weight:700;color:var(--dark)}
.dayLine select{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.chip span{display:inline-block;padding:8px 14px;border:1px solid var(--line);border-radius:99px;background:#fff;font-size:15px;font-weight:500}
.chip input:checked+span{background:var(--c);color:#fff;border-color:var(--c)}
.chip input:focus-visible+span{outline:3px solid color-mix(in srgb,var(--c) 45%,white)}
details.pop{border-top:1px solid var(--line);padding:8px 0}
details.pop summary{font-weight:700;cursor:pointer;color:var(--dark);padding:4px 0}
details.pop p{margin:6px 0;font-size:14px}
.checkItem{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-weight:400;margin:0}
.checkItem input{width:24px;height:24px;margin:0;flex-shrink:0}
.checkItem.done span{text-decoration:line-through;color:var(--muted)}
pre.box{white-space:pre-wrap;font:14px/1.45 system-ui,sans-serif;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;max-height:340px;overflow:auto;margin:8px 0}
.linkbox{word-break:break-all;font-size:14px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.alert{padding:12px 14px;background:#fff1ce;border-left:4px solid var(--warn);border-radius:10px;font-size:14px;margin:10px 0}
.tip{padding:12px 14px;background:var(--soft);border-radius:12px;font-size:14px;margin:10px 0}
#feedback{position:fixed;top:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:550px;z-index:50;background:var(--dark);color:#fff;border-radius:14px;padding:12px;text-align:center;font-weight:600;box-shadow:0 6px 20px #0003;display:none}
#feedback.erro{background:var(--bad)}
#modal{position:fixed;inset:0;background:#0006;z-index:40;display:flex;align-items:flex-end;justify-content:center;padding:10px}
#modal .sheet{background:#fffdf8;border-radius:24px;padding:20px 18px;width:100%;max-width:560px;max-height:88vh;overflow:auto;margin-bottom:env(safe-area-inset-bottom,0px)}
#modal h3{font-family:Georgia,serif;font-size:21px;color:var(--dark)}
footer{max-width:580px;margin:auto;padding:0 16px 110px;text-align:center;font-size:11px;color:var(--muted)}
.steplabel{font-size:13px;color:var(--muted)}
.progress{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.progress>i{display:block;height:100%;background:var(--c)}
.slots{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.slot{background:#fff;color:var(--dark);border:1.5px solid var(--line);padding:9px 11px;font-size:14px;border-radius:11px}
.slot.on{background:var(--c);color:#fff;border-color:var(--c)}
.vTime{font-weight:800;color:var(--dark);font-size:15px}
table.ft{width:100%;border-collapse:collapse;font-size:13.5px;margin:6px 0}
table.ft th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 4px;border-bottom:1px solid var(--line)}
table.ft td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.ft td.n,table.ft th.n{text-align:right;white-space:nowrap}
table.ft tr.tot td{font-weight:800;border-bottom:0;color:var(--dark)}
.catT{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:12px 0 2px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0}
.bar>i{display:block;height:100%;background:var(--c)}
@media(max-width:360px){.shortcuts{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}header h1{font-size:34px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>




</head>
<body>
<div id="storageWarn" hidden>Atenção: este celular não está guardando os dados. Use a Cópia de segurança antes de fechar.</div>
<div class="notice" id="notice">Salve sua cópia toda semana</div>
<header id="header"></header>
<main id="screen"></main>
<nav id="nav" aria-label="Menu principal"></nav>
<footer id="footer"></footer>
<div id="feedback" role="status" aria-live="polite"></div>
<div id="modal" hidden><div class="sheet" role="dialog" aria-modal="true" id="sheet"></div></div>
<script>
(function(){
"use strict";
const COPY="© I.N.A.T — uso licenciado. Proibida a cópia ou revenda.";
const FALLBACK_URL="https://ina-rgb.github.io/agendabeleza/";
const PAGE_URL=/github\.io|netlify\.app|vercel\.app/.test(location.hostname)?location.origin+location.pathname:FALLBACK_URL;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(Number(n)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;let s=String(v||'').replace(/[^\d,.-]/g,'');if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n};
const brl=n=>String(Math.round(num(n)*100)/100).replace('.',',');
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ymd(d)};
const today=()=>ymd(new Date());
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const tmin=t=>{const[h,m]=String(t||'0:0').split(':').map(Number);return (h||0)*60+(m||0)};
const tstr=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const DOW=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const DOWL=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
const fmtD=s=>{const d=parse(s);return DOWL[d.getDay()]+', '+pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const fmtShort=s=>{const d=parse(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const ymOf=s=>s.slice(0,7);
const monthName=ym=>{const[y,m]=ym.split('-').map(Number);return new Date(y,m-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'})};
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const addMonth=(ym,n)=>{const[y,m]=ym.split('-').map(Number);const d=new Date(y,m-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const lastDay=ym=>{const[y,m]=ym.split('-').map(Number);return ym+'-'+pad(new Date(y,m,0).getDate())};
const waLink=(phone,text)=>{let d=String(phone||'').replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;return 'https://wa.me/'+d+(text?'?text='+encodeURIComponent(text):'')};
const b64e=s=>btoa(unescape(encodeURIComponent(s)));
const b64d=s=>decodeURIComponent(escape(atob(s)));

/* ---------- ilustração própria: vidro de esmalte + lixa + brilhos ---------- */
const ART=(big)=>`<svg viewBox="0 0 120 96" ${big?'class="coverArt"':''} role="img" aria-label="Vidro de esmalte com lixa e brilhos" xmlns="http://www.w3.org/2000/svg">
<g fill="currentColor">
<ellipse cx="60" cy="86" rx="40" ry="4" opacity=".15"/>
<rect x="52" y="14" width="16" height="30" rx="4"/>
<rect x="49" y="40" width="22" height="7" rx="2" opacity=".7"/>
<path d="M40 50 Q40 46 44 46 H76 Q80 46 80 50 L83 80 Q83 86 77 86 H43 Q37 86 37 80 Z" opacity=".85"/>

function pkgInfo(h){const pk=(h.pkgs||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
 const starts=[...pk.map(p=>p.date),...(h.sched||[]).map(s=>s.from),...S.extras.filter(e=>e.cli===h.id).map(e=>e.date)].sort();
 const res={list:pk.map(p=>({p,used:0,left:num(p.sessions)})),over:new Set(),left:0,next:0};
 if(!starts.length)return res;
 const all=visitsOfClient(h,starts[0],addDays(today(),60));
 all.filter(usesPk).forEach(v=>{const slot=res.list.find(x=>x.left>0);if(slot){slot.used++;slot.left--}else res.over.add(v.id)});
 res.left=res.list.reduce((s,x)=>s+x.left,0);res.next=all.filter(v=>v.mode==='pacote'&&!v.st&&v.date>=today()).length;return res}
function monthStats(h,ym){const r={total:0,feitas:0,cancel:0,desm:0,repor:0,falta:0,rest:0,list:[]};const t=today();
 const pi=(h.cob==='pacote'||(h.pkgs||[]).length||S.extras.some(e=>e.cli===h.id&&e.mode==='pacote'))?pkgInfo(h):{over:new Set()};
 let dev=0;
 visitsOfClient(h,ym+'-01',lastDay(ym)).forEach(v=>{if(v.st==='tirado')return;if(v.kind==='remarcada'||v.kind==='avulso'||v.kind==='fixa')r.total++;let k='next';
  if(v.st==='feita'){r.feitas++;k='done';if(v.mode==='avulso')dev+=num(v.price);else if(pi.over.has(v.id))dev+=svcPrice(v.svcs)}
  else if(v.st==='cancel'){r.cancel++;k='bad'}else if(v.st==='cancel-repor'){r.desm++;if(!v.rep)r.repor++;k=v.rep?'moved':'rep'}else if(v.st==='falta'){r.falta++;if(!v.rep)r.repor++;k=v.rep?'moved':'rep';if(pi.over.has(v.id))dev+=svcPrice(v.svcs)}else if(v.st==='remarcada'){k='moved';r.total--}else if(v.date>=t){r.rest++}else k='past';
  r.list.push({ds:v.date,k})});
 if(h.cob==='mensal')dev+=num(h.mensal);
 (h.pkgs||[]).filter(p=>ymOf(p.date)===ym).forEach(p=>dev+=num(p.price));
 r.devido=dev;r.pago=S.payments.filter(p=>p.cli===h.id&&p.month===ym).reduce((s,p)=>s+num(p.value),0);return r}
function finReport(ym){const rows={};const row=id=>rows[id]=rows[id]||{name:(svc(id)||{}).name||'Outros',qa:0,va:0,qp:0,qm:0};let atend=0,canc=0;
 S.clients.forEach(h=>{const pi=(h.pkgs||[]).length||h.cob==='pacote'?pkgInfo(h):{over:new Set()};
  visitsOfClient(h,ym+'-01',lastDay(ym)).forEach(v=>{if(v.st==='cancel'||v.st==='cancel-repor'||v.st==='falta')canc++;if(v.st!=='feita')return;atend++;const ids=v.svcs&&v.svcs.length?v.svcs:['_outros'];
   const avulso=v.mode==='avulso'||pi.over.has(v.id);const total=v.mode==='avulso'?num(v.price):svcPrice(v.svcs);const lp=ids.map(i=>svc(i)?num(svc(i).price):0);const sum=lp.reduce((a,b)=>a+b,0);
   ids.forEach((i,j)=>{const r=row(i);if(avulso){r.qa++;r.va+=sum?total*lp[j]/sum:total/ids.length}else if(v.mode==='pacote')r.qp++;else r.qm++})})});
 const pk={};S.clients.forEach(h=>(h.pkgs||[]).filter(p=>ymOf(p.date)===ym).forEach(p=>{pk[p.name]=pk[p.name]||{q:0,v:0};pk[p.name].q++;pk[p.name].v+=num(p.price)}));
 const me=S.clients.filter(h=>h.cob==='mensal');const meV=me.reduce((s,h)=>s+num(h.mensal),0);
 const meth={};S.payments.filter(p=>p.month===ym).forEach(p=>meth[p.method]=(meth[p.method]||0)+num(p.value));
 const list=Object.values(rows).sort((a,b)=>b.va-a.va||(b.qa+b.qp+b.qm)-(a.qa+a.qp+a.qm));
 const va=list.reduce((s,r)=>s+r.va,0),pv=Object.values(pk).reduce((s,r)=>s+r.v,0);
 return {list,pk,meN:me.length,meV,meth,va,pv,total:va+pv+meV,atend,canc}}
function schedText(h){const s=schedFor(h,today())||(h.sched||[]).slice(-1)[0];if(!s||!s.days)return '';const ks=Object.keys(s.days).filter(k=>s.days[k]).map(Number).sort((a,b)=>((a+6)%7)-((b+6)%7));if(!ks.length)return '';
 return ks.map(k=>DOW[k]+' '+s.days[k]).join(' · ')+(s.freq==='quinzenal'?' · a cada 15 dias':s.freq==='mensal'?' · 1x por mês ('+(s.wk||1)+'ª semana)':' · toda semana')}
const cobText=h=>h.cob==='mensal'?'Mensal fixo: '+money(h.mensal):h.cob==='pacote'?'Usa pacote de sessões':'Paga por atendimento';
function nextOf(h){const t=today();return visitsOfClient(h,t,addDays(t,60)).filter(v=>OCC(v)&&v.st!=='feita'&&!(v.date===t&&tmin(v.time)+svcDur(v.svcs)<nowMin()))}

 <div class="card"><h3>3. Horário fixo <small class="muted">(opcional)</small></h3><p class="small muted">Só se ela vem sempre no mesmo dia e hora. Marque o dia e coloque o horário.</p>
 <div class="dayRows">${order.map(d=>`<div class="dayLine"><label class="dayBox" style="margin:0"><input type="checkbox" name="d${d}" ${s.days&&s.days[d]?'checked':''} aria-label="${DOWL[d]}"><span>${DOW[d]}</span></label><input type="time" name="t${d}" value="${esc(s.days&&s.days[d]||'')}" step="900" aria-label="Horário de ${DOWL[d]}" style="margin:0"></div>`).join('')}</div>
 <label>Frequência<select name="freq"><option value="semanal" ${!s.freq||s.freq==='semanal'?'selected':''}>Toda semana</option><option value="quinzenal" ${s.freq==='quinzenal'?'selected':''}>A cada 15 dias</option><option value="mensal" ${s.freq==='mensal'?'selected':''}>1x por mês</option></select></label>
 <label>Se for 1x por mês, em qual semana?<select name="wk">${[1,2,3,4].map(n=>`<option value="${n}" ${(s.wk||1)===n?'selected':''}>${n}ª semana do mês</option>`).join('')}</select></label>
 <div style="font-weight:600;font-size:14px;margin-top:12px">Serviços do horário fixo</div>${svcChips('fsvc',fs)}
 <label>${h?'Valendo a partir de <small>(o que já passou não muda)</small>':'Começa em'}<input type="date" name="from" value="${today()}"></label></div>
 <button class="full">✓ Salvar cliente</button></form>`},

agenda(){const d=agDate;const wd=parse(d).getDay();const mon=addDays(d,-((wd+6)%7));const vs=visitsOn(d);const fr=freeSlots(d,30);
 return `<h2>Agenda</h2><div class="card"><div class="dayNav"><button class="white mini" data-a="ag" data-x="${addDays(d,-1)}" aria-label="Dia anterior">‹</button><div><b>${esc(fmtD(d))}</b>${d!==today()?`<br><button class="light mini" data-a="ag" data-x="${today()}">Voltar para hoje</button>`:''}</div><button class="white mini" data-a="ag" data-x="${addDays(d,1)}" aria-label="Próximo dia">›</button></div>
 <div class="week">${[0,1,2,3,4,5,6].map(i=>{const x=addDays(mon,i);const n=visitsOn(x).filter(OCC).length;return `<button class="${x===d?'on':''}" data-a="ag" data-x="${x}">${DOW[parse(x).getDay()]}<i>${parse(x).getDate()}</i><em>${n?n+' 💅':'·'}</em></button>`}).join('')}</div>
 <button class="full" data-a="novo" data-d="${d}">＋ Novo horário neste dia</button>
 <div class="period"><div class="periodHead">Horários marcados <span class="small muted">${vs.filter(OCC).length}</span></div>${vs.map(v=>visitCard(v)).join('')||'<p class="small muted center">Nenhum horário.</p>'}</div>
 <div class="period"><div class="periodHead">Horários livres</div>${(S.hours.days||[]).includes(wd)?(fr.length?`<p class="small muted" style="margin:0">Toque para marcar.</p><div class="slots">${fr.map(t=>`<button class="slot" data-a="novo" data-d="${d}" data-t="${t}">${t}</button>`).join('')}</div>`:'<p class="small muted center">Sem horários livres.</p>'):'<p class="small muted center">Você não atende neste dia.</p>'}</div></div>`},

fin(){const ym=finMonth;let dev=0,pag=0;const rows=S.clients.map(h=>{const r=monthStats(h,ym);dev+=r.devido;pag+=r.pago;return {h,r}});const R=finReport(ym);
 return `<h2>${PLUS()?'Financeiro':'Recebidos'}</h2><div class="card"><div class="dayNav"><button class="white mini" data-a="fm" data-x="${addMonth(ym,-1)}" aria-label="Mês anterior">‹</button><b>${esc(cap(monthName(ym)))}</b><button class="white mini" data-a="fm" data-x="${addMonth(ym,1)}" aria-label="Próximo mês">›</button></div></div>
 ${PLUS()?`<div class="card"><h3>📊 Resumo do mês</h3><div class="stats"><button class="statBtn ${finFilter==='recebidos'?'on':''}" data-a="ff" data-x="recebidos"><b style="font-size:15px">${money(pag)}</b><small>recebido ›</small></button><button class="statBtn ${finFilter==='abertos'?'on':''}" data-a="ff" data-x="abertos"><b style="font-size:15px">${money(Math.max(0,dev-pag))}</b><small>a receber ›</small></button><div><b>${R.atend}</b><small>atendimentos</small></div><div><b>${R.canc}</b><small>desmarcações</small></div></div>
 ${Object.keys(R.meth).length?`<p class="small muted" style="margin:10px 0 0">Recebido por forma: ${Object.entries(R.meth).map(([k,v])=>esc(k)+' '+money(v)).join(' · ')}</p>`:''}</div>
 <div class="card"><h3>💅 Por serviço</h3>${R.list.length?`<table class="ft"><thead><tr><th>Serviço</th><th class="n">Avulso</th><th class="n">Valor</th><th class="n">Pacote / mensal</th></tr></thead><tbody>${R.list.map(r=>`<tr><td>${esc(r.name)}</td><td class="n">${r.qa}</td><td class="n">${money(r.va)}</td><td class="n">${r.qp+r.qm}</td></tr>`).join('')}<tr class="tot"><td>Total avulsos</td><td class="n">${R.list.reduce((s,r)=>s+r.qa,0)}</td><td class="n">${money(R.va)}</td><td class="n">${R.list.reduce((s,r)=>s+r.qp+r.qm,0)}</td></tr></tbody></table><p class="small muted">"Pacote / mensal" é quantas vezes o serviço foi feito dentro de pacote ou mensalidade (o valor entra abaixo).</p>`:'<p class="small muted">Nenhum atendimento marcado como feito neste mês.</p>'}
 <div class="catT">Pacotes vendidos</div>${Object.keys(R.pk).length?Object.entries(R.pk).map(([n,x])=>`<div class="money"><span>${esc(n)} <span class="muted small">× ${x.q}</span></span><b>${money(x.v)}</b></div>`).join(''):'<p class="small muted" style="margin:4px 0">Nenhum pacote vendido.</p>'}
 <div class="catT">Mensalidades</div><div class="money"><span>${R.meN} cliente(s) no mensal fixo</span><b>${money(R.meV)}</b></div>
 <div class="money" style="border-top:2px solid var(--line);margin-top:6px"><span><b>Total do mês</b></span><b>${money(R.total)}</b></div></div>`:lockBox('Relatório por serviço','Quanto entrou em cada serviço, pacotes vendidos e mensalidades.')}
 <div class="filterBar" role="group" aria-label="Mostrar">${[['todas','Todas'],['abertos','A receber'],['recebidos','Recebidos']].map(([k,l])=>`<button class="${finFilter===k?'on':''}" data-a="ff" data-x="${k}" aria-pressed="${finFilter===k}">${l}</button>`).join('')}</div>
 ${(()=>{const fr=rows.filter(({r})=>(finFilter==='abertos'?r.devido>r.pago:finFilter==='recebidos'?r.pago>0:(r.devido||r.pago)));return fr.length?fr.map(({h,r})=>`<div class="card"><div class="row"><b style="flex:1">${esc(h.cliente)}</b><span class="tag ${r.devido&&r.pago>=r.devido?'ok':r.pago?'warn':'grey'}">${r.devido&&r.pago>=r.devido?'Pago':r.pago?'Parcial':'Em aberto'}</span></div>
  <p class="small muted" style="margin:4px 0">${esc(cobText(h))} · ${r.feitas} atendimento(s)</p>
  <div class="money"><span>Valor</span><b>${money(r.devido)}</b></div><div class="money"><span>Recebido</span><b>${money(r.pago)}</b></div>
  <div class="grid2" style="margin-top:8px"><button class="light" data-a="pagar" data-h="${h.id}" data-m="${ym}">Registrar pagamento</button>${PLUS()?(h.phone?`<a class="btn light" href="${esc(waLink(h.phone,fillTpl('cobranca',h,{mes:monthName(ym),feitas:r.feitas,valor:money(Math.max(0,r.devido-r.pago))})))}" target="_blank" rel="noopener">💬 Cobrar</a>`:'<span class="small muted">Sem WhatsApp</span>'):`<button class="white" data-a="lockinfo">🔒 Cobrar no WhatsApp</button>`}</div>
  ${S.payments.filter(p=>p.cli===h.id&&p.month===ym).map(p=>`<p class="small muted" style="margin:6px 0 0">• ${esc(fmtShort(p.date))} · ${esc(p.method)} · ${money(p.value)}${p.note?' · '+esc(p.note):''} <button class="white mini" data-a="delPay" data-x="${p.id}" aria-label="Apagar pagamento">✗</button></p>`).join('')}</div>`).join(''):`<p class="muted center">${finFilter==='abertos'?'Ninguém em aberto neste mês 🎉':finFilter==='recebidos'?'Nenhum pagamento registrado neste mês.':'Nenhum valor neste mês.'}</p>`})()}`},

more(){const t=(p,ic,ti,de,lk)=>`<button class="menuTile" data-a="${lk?'lockinfo':'go'}" data-p="${p}"><span class="mIc">${ic}</span><span><b>${ti}${lk?' 🔒':''}</b><small>${de}</small></span><span class="chev">›</span></button>`;
 return `<h2>Mais opções</h2><div class="menuList">${t('link','📝','Link da ficha da cliente','A cliente conta como gosta, por voz')}${t('prices','🧾','Serviços, pacotes e preços','Seus serviços, tempo de cada um e pacotes')}${t('hours','🕘','Horário de atendimento','Dias e horários em que você atende')}${t('tpls','💬','Modelos de mensagem','Confirmar, remarcar, cobrar, renovar',!PLUS())}${t('policy','📋','Combinados de agenda','Regra de desmarcação para mandar à cliente',!PLUS())}${t('settings','🎨','Personalizar','Logo, foto, cor e nome')}${t('backup','💾','Cópia de segurança','Guardar seus dados')}</div>
 <p class="center small muted" style="margin-top:18px">Plano <b>${esc(S.plan)}</b>${DEMO?' · demonstração':''}</p>`},

link(){const p=S.pro;const ok=p.name&&String(p.phone).replace(/\D/g,'').length>=10;
 return `<button class="white mini" data-a="go" data-p="more">‹ Voltar</button><h2>Link da ficha da cliente</h2>
 <div class="card"><p class="small muted">Preencha uma vez. A cliente abre o link, conta como gosta e a ficha chega no seu WhatsApp.</p>
 <form data-f="pro"><label>Seu nome (como a cliente vai ver)<input name="name" value="${esc(p.name)}" required placeholder="Ex.: Camila"></label><label>Seu WhatsApp com DDD<input name="phone" inputmode="tel" value="${esc(p.phone)}" required placeholder="47 99999-8888"></label><button class="full">Salvar e gerar meu link</button></form>
 ${ok?`<div class="tip"><b>Mensagem pronta para a cliente</b> <small>(o link já vai junto)</small>:<br>${esc(fillTpl('boas',{cliente:''}))}</div><button class="full" data-a="copy" data-t="boas">Copiar mensagem com o link</button><p class="small muted center" style="margin:14px 0 4px">Só o link, se precisar:</p><div class="linkbox">${esc(myLink())}</div><button class="light full" data-a="copy" data-t="link">Copiar só o link</button>`:''}</div>
 <div class="card"><h3>Quando a resposta chegar</h3><p class="small">1. No WhatsApp, segure a mensagem da cliente e toque em <b>Copiar</b>.<br>2. Aqui no app, abra a ficha dela e toque em <b>Colar respostas da cliente</b>.<br>3. Pronto: fica tudo na ficha.</p><button class="light full" data-a="colar" data-h="">Colar respostas e criar cliente nova</button></div>`},

prices(){const byCat=c=>S.services.filter(x=>(x.cat||'Outros')===c);
 return `<button class="white mini" data-a="go" data-p="more">‹ Voltar</button><h2>Serviços, pacotes e preços</h2>
 <div class="card"><h3>Serviços</h3><p class="small muted">O tempo de cada serviço é usado para mostrar os horários livres.</p>${CATS.map(c=>byCat(c).length?`<div class="catT">${esc(c)}</div>${byCat(c).map(x=>`<form data-f="svc" data-x="${x.id}" style="border-bottom:1px solid var(--line);padding-bottom:6px"><label style="margin:8px 0 4px">Nome<input name="name" value="${esc(x.name)}" required></label><div class="row" style="align-items:end"><label style="margin:4px 0">Preço<input name="price" inputmode="decimal" value="${esc(brl(x.price))}"></label><label style="margin:4px 0">Minutos<input name="dur" inputmode="numeric" value="${esc(x.dur)}"></label><button class="mini" style="flex:0 0 auto;margin:4px 0" aria-label="Salvar ${esc(x.name)}">✓</button><button type="button" class="danger mini" style="flex:0 0 auto;margin:4px 0" data-a="delSvc" data-x="${x.id}" aria-label="Apagar ${esc(x.name)}">✗</button></div></form>`).join('')}`:'').join('')}
 <div class="catT">＋ Novo serviço</div><form data-f="svcNew"><label style="margin:8px 0 4px">Nome<input name="name" required placeholder="Ex.: Francesinha"></label><div class="row" style="align-items:end"><label style="margin:4px 0">Preço<input name="price" inputmode="decimal"></label><label style="margin:4px 0">Minutos<input name="dur" inputmode="numeric" value="30"></label></div><label style="margin:4px 0">Tipo<select name="cat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><button class="full">＋ Adicionar serviço</button></form></div>
 <div class="card"><h3>Pacotes de sessões</h3><p class="small muted">Ex.: 4 pés e mãos pagos antes. O app desconta uma sessão a cada atendimento.</p>${S.packs.map(x=>`<form data-f="pack" data-x="${x.id}"><label style="margin:8px 0 4px">Nome do pacote<input name="name" value="${esc(x.name)}" required></label><div class="row" style="align-items:end"><label style="margin:4px 0">Sessões<input name="sessions" inputmode="numeric" value="${esc(x.sessions)}"></label><label style="margin:4px 0">Preço<input name="price" inputmode="decimal" value="${num(x.price)?esc(brl(x.price)):''}"></label></div><label style="margin:4px 0">Serviço<select name="svc">${S.services.map(s=>`<option value="${s.id}" ${x.svc===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}</select></label><div class="grid2"><button class="mini">Salvar</button><button type="button" class="danger mini" data-a="delPack" data-x="${x.id}">Apagar</button></div></form>`).join('<hr style="border:0;border-top:1px solid var(--line)">')}
 <button class="light full" data-a="addPack">＋ Novo pacote</button></div>
 <div class="tip small"><b>Mensal fixo:</b> o valor é colocado na ficha de cada cliente (Editar → Como ela paga).</div>`},

hours(){const H=S.hours;return `<button class="white mini" data-a="go" data-p="more">‹ Voltar</button><h2>Horário de atendimento</h2>
 <form class="card" data-f="hours"><p class="small muted">Usado para mostrar os horários livres na agenda e na hora de remarcar.</p>
 <div style="font-weight:600;font-size:14px">Dias em que atende</div><div class="dayBoxes">${[1,2,3,4,5,6,0].map(d=>`<label class="dayBox"><input type="checkbox" name="hd" value="${d}" ${(H.days||[]).includes(d)?'checked':''} aria-label="${DOWL[d]}"><span>${DOW[d]}</span></label>`).join('')}</div>
 <div class="grid2"><label>Começa às<input type="time" name="start" value="${esc(H.start)}" required></label><label>Termina às<input type="time" name="end" value="${esc(H.end)}" required></label></div>
 <label>Mostrar horários a cada<select name="step">${[15,30,60].map(n=>`<option value="${n}" ${(parseInt(H.step)||30)===n?'selected':''}>${n} minutos</option>`).join('')}</select></label>
 <button class="full">✓ Salvar</button></form>`},

tpls(){if(!PLUS())return lockBox('Modelos de mensagem','Mensagens prontas para cada momento com a cliente.');
 return `<button class="white mini" data-a="go" data-p="more">‹ Voltar</button><h2>Modelos de mensagem</h2><p class="small muted">Edite do seu jeito. Palavras entre { } são trocadas sozinhas: {cliente}, {profissional}, {quando}, {servico}, {link}.</p>
 ${Object.keys(DEF_TPL).filter(k=>k!=='politica').map(k=>`<div class="card"><h3>${esc(TPL_NAMES[k])}</h3><textarea data-tpl="${k}" aria-label="${esc(TPL_NAMES[k])}">${esc(S.tpl[k]||DEF_TPL[k])}</textarea><button class="white mini full" data-a="tplReset" data-x="${k}">Voltar ao original</button></div>`).join('')}`},

policy(){if(!PLUS())return lockBox('Combinados de agenda','Regra de desmarcação pronta para mandar à cliente.');
 return `<button class="white mini" data-a="go" data-p="more">‹ Voltar</button><h2>Combinados de agenda</h2><div class="card"><p class="small muted">Mande para cada cliente no começo. Evita discussão quando alguém desmarca.</p><textarea data-tpl="politica" style="min-height:170px" aria-label="Combinados de agenda">${esc(S.tpl.politica||DEF_TPL.politica)}</textarea><button class="light full" data-a="copy" data-t="politica">Copiar</button><button class="white full" data-a="tplReset" data-x="politica">Voltar ao original</button></div>`},

settings(){const SW=[['#c4517a','Rosa'],['#b76e79','Rosé'],['#8c2f4b','Vinho'],['#7a4b8c','Lilás'],['#b0603f','Terracota'],['#a0784f','Nude'],['#2c6e57','Verde'],['#4a5560','Grafite']];
 return `<button class="white mini" data-a="go" data-p="more">‹ Voltar</button><h2>Personalizar</h2><p class="muted small">Toque para trocar. Salva sozinho.</p>
 <div class="card"><h3>1. Logo</h3><div class="tileImg">${S.logo?`<img src="${S.logo}" alt="Logo atual">`:`<img src="${PHOTO_FACE}" alt="Foto atual" style="border-radius:50%">`}</div><label class="fileBtn">📷 ${S.logo?'Trocar logo':'Colocar logo'}<input id="logoFile" type="file" accept="image/*" hidden></label>${S.logo?`<button class="danger full" data-a="rmImg" data-x="logo">Tirar logo</button>`:''}</div>
 <div class="card"><h3>2. Foto de capa <small class="muted">(aparece no Início)</small></h3><div class="tileImg">${S.cover?`<img src="${S.cover}" alt="Capa atual">`:`<img src="${PHOTO_COVER}" alt="Capa atual">`}</div><label class="fileBtn">📷 ${S.cover?'Trocar foto de capa':'Colocar foto de capa'}<input id="coverFile" type="file" accept="image/*" hidden></label>${S.cover?`<button class="danger full" data-a="rmImg" data-x="cover">Tirar foto de capa</button>`:''}</div>
 <div class="card"><h3>3. Cor do aplicativo</h3><div class="swatches">${SW.map(([c,n])=>`<button class="sw ${S.color===c?'on':''}" style="background:${c}" data-a="color" data-x="${c}" aria-label="Cor ${n}">${S.color===c?'✓':''}<span>${n}</span></button>`).join('')}</div></div>
 <form class="card" data-f="proName"><h3>4. Seu nome</h3><p class="small muted">Aparece no "Bom dia" e na ficha que a cliente recebe.</p><input name="pname" value="${esc(S.pro.name)}" maxlength="40" required aria-label="Seu nome" placeholder="Ex.: Camila"><button class="full" style="margin-top:10px">✓ Salvar meu nome</button></form>
 <form class="card" data-f="name"><h3>5. Nome no topo</h3><input name="name" value="${esc(S.name)}" maxlength="40" required aria-label="Nome no topo"><button class="full" style="margin-top:10px">✓ Salvar nome</button></form>
 <p class="muted center small">Plano contratado: <b>${esc(S.plan)}</b>. Para mudar de plano, fale com o suporte.</p>`},

backup(){return `<button class="white mini" data-a="go" data-p="more">‹ Voltar</button><h2>Cópia de segurança</h2>
 <div class="card"><p class="small">Seus dados ficam <b>só neste celular</b>. Faça uma cópia toda semana e guarde no seu WhatsApp (mande para você mesma).</p>${S.lastBackup?`<p class="small muted">Última cópia: ${esc(S.lastBackup)}</p>`:'<p class="small" style="color:var(--bad)">Você ainda não fez nenhuma cópia.</p>'}
 <button class="full" data-a="copy" data-t="backup">1. Copiar minha cópia</button><p class="small muted">2. Abra o WhatsApp, entre na conversa com você mesma e cole.</p></div>
 <div class="card"><h3>Restaurar uma cópia</h3><p class="small muted">Use se trocar de celular ou se o app abrir vazio. Isso substitui tudo o que está aqui agora.</p><textarea id="restoreBox" placeholder="Cole aqui a cópia" aria-label="Cópia para restaurar"></textarea><button class="light full" data-a="restore">Restaurar</button></div>`}
};

function svcChips(name,sel){return CATS.map(c=>{const l=S.services.filter(x=>(x.cat||'Outros')===c);return l.length?`<div class="catT">${esc(c)}</div><div class="chips">${l.map(x=>`<label class="chip" style="margin:0"><input type="checkbox" name="${name}" value="${x.id}" ${(sel||[]).includes(x.id)?'checked':''}><span>${esc(x.name)}</span></label>`).join('')}</div>`:''}).join('')}
function careCard(h){const a=h.prefs||{};const items=[];const add=(ic,t,bad)=>items.push(`<p style="margin:6px 0"${bad?' class="alert"':''}>${ic} ${t}</p>`);
 if(aval(a,'q12'))add('⚠️','<b>Alergia:</b> '+esc(aval(a,'q12')),1);
 if(aval(a,'q13'))add('⚠️','<b>Cuidado:</b> '+esc(aval(a,'q13')),1);
 const un=[aval(a,'q3'),aval(a,'q4')].filter(Boolean).join(', ');if(un)add('💅','<b>Unha:</b> '+esc(un));
 if(aval(a,'q5'))add('✂️','<b>Cutícula:</b> '+esc(aval(a,'q5')));
 if(aval(a,'q6'))add('🎨','<b>Ama:</b> '+esc(aval(a,'q6')));
 if(aval(a,'q7'))add('🚫','<b>Não gosta:</b> '+esc(aval(a,'q7')));
 const dp=[aval(a,'q10'),aval(a,'q11')?'pele sensível: '+aval(a,'q11').toLowerCase():''].filter(Boolean).join(' · ');if(dp)add('🌸','<b>Depilação:</b> '+esc(dp));
 if(aval(a,'q15'))add('✨','<b>Detalhe que encanta:</b> '+esc(aval(a,'q15')));
 if(!items.length)return '';return `<div class="card"><h3>Lembrete para o atendimento</h3>${items.join('')}</div>`}
function welcomeCard(h){const txt=fillTpl('boas',h)+(PLUS()?'\n\n'+fillTpl('politica',h):'');
 if(h.welcomed)return `<div class="card"><h3>👋 Primeira mensagem</h3><p class="small">✓ Enviada em ${esc(h.welcomed)}.</p><a class="btn light full" data-a="welcomed" data-h="${h.id}" href="${esc(waLink(h.phone,txt))}" target="_blank" rel="noopener">Mandar de novo</a></div>`;
 return `<div class="card" style="border:2px solid var(--c)"><h3>👋 Primeira mensagem para a cliente</h3><p class="small muted">Vai num recado só: a apresentação, o link da ficha${PLUS()?' e os combinados de agenda':''}.</p>${!h.phone?'<p class="small" style="color:var(--bad)">Coloque o WhatsApp da cliente em Editar.</p>':!S.pro.phone?`<button class="full" data-a="go" data-p="link">Criar meu link primeiro</button>`:`<a class="btn full" data-a="welcomed" data-h="${h.id}" href="${esc(waLink(h.phone,txt))}" target="_blank" rel="noopener">📲 Mandar primeira mensagem</a>`}</div>`}
function myLink(){let d=String(S.pro.phone||'').replace(/\D/g,'');if(d.length===10||d.length===11)d='55'+d;const slug=String(S.pro.name||'').normalize('NFD').replace(/[̀-ͯ]/g,'').trim().replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);return PAGE_URL+'#f-'+d+(slug?'-'+slug:'')}
function fillTpl(k,h,extra){let t=S.tpl[k]||DEF_TPL[k];const m=Object.assign({cliente:first(h&&h.cliente),profissional:S.pro.name||'',link:myLink()},extra||{});return t.replace(/\{(\w+)\}/g,(x,n)=>m[n]!=null?m[n]:x).replace(/Olá, !/,'Olá!').replace(/Oi, !/,'Oi!').replace(/Feliz aniversário, !/,'Feliz aniversário!')}
const vMsg=v=>({quando:fmtD(v.date)+' às '+v.time,servico:svcNames(v.svcs)});

/* ---------- formulários de horário ---------- */
function slotsHtml(date,dur,excl,sel){const fr=freeSlots(date,dur,excl);if(!(S.hours.days||[]).includes(parse(date).getDay()))return '<p class="small muted" style="margin:4px 0">Você não atende neste dia — escolha o horário abaixo mesmo assim, se quiser.</p>';
 return fr.length?`<div class="slots">${fr.map(t=>`<button type="button" class="slot ${t===sel?'on':''}" data-a="pickTime" data-x="${t}">${t}</button>`).join('')}</div>`:'<p class="small muted" style="margin:4px 0">Sem horário livre neste dia.</p>'}
function updSlots(f){const box=f.querySelector('.slotBox');if(!box)return;const dur=f.dataset.dur?parseInt(f.dataset.dur):svcDur([...f.querySelectorAll('input[name=svc]:checked')].map(x=>x.value));const d=f.elements.date.value;if(!d){box.innerHTML='';return}box.innerHTML=slotsHtml(d,dur,f.dataset.v||'',f.elements.time.value)}
function modeDefault(h){if(!h)return 'avulso';const pi=(h.pkgs||[]).length?pkgInfo(h):null;if(pi&&pi.left>0)return 'pacote';if(h.cob==='mensal')return 'mensal';if(h.cob==='pacote')return 'pacote';return 'avulso'}

 openModal(`<h3>Novo horário</h3><form data-f="novo" data-slots="1">
 <label>Cliente<select name="cli">${S.clients.length&&!h?'<option value="">Escolha a cliente…</option>':''}${S.clients.slice().sort((a,b)=>a.cliente.localeCompare(b.cliente)).map(x=>`<option value="${x.id}" ${h&&h.id===x.id?'selected':''}>${esc(x.cliente)}</option>`).join('')}<option value="__new">＋ Cliente nova</option></select></label>

function loadImg(file,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL(max<=300?'image/png':'image/jpeg',.82))};im.onerror=()=>feedback('Não consegui abrir essa imagem.',true);im.src=r.result};r.readAsDataURL(file)}
function parseCad(txt){const N=x=>x.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();const o={nome:'',fone:'',nasc:'',dias:[],hora:'',svc:''};let hit=0;
 txt.split(/\n/).forEach(l=>{const i=l.indexOf(':');if(i<0)return;const k=N(l.slice(0,i)),v=l.slice(i+1).trim();if(!v)return;
  if(/^nome/.test(k)){o.nome=v;hit++}else if(/whats|telefone|celular|fone/.test(k)){o.fone=v;hit++}else if(/aniver|nasc/.test(k)){o.nasc=v.slice(0,5);hit++}else if(/servic/.test(k)){o.svc=v;hit++}
  else if(/^dia|horario/.test(k)){hit++;const t=N(v);[['seg',1],['ter',2],['qua',3],['qui',4],['sex',5],['sab',6],['dom',0]].forEach(([w,n])=>{if(t.includes(w))o.dias.push(n)});const hm=t.match(/(\d{1,2})\s*(?:h|:)\s*(\d{2})?/);if(hm)o.hora=pad(Math.min(23,+hm[1]))+':'+(hm[2]||'00')}});
 return hit?o:null}
function parseAnswers(txt){if(!/FICHA DA CLIENTE/.test(txt))return null;const a={};const nm=(txt.match(/FICHA DA CLIENTE\s*[—-]\s*(.+)/)||[])[1];if(nm)a.cliente=nm.trim();
 const qs={};BLOCKS.forEach(b=>b.qs.forEach(q=>qs[q.id]=q));const ids=Object.keys(LABELS).sort((x,y)=>LABELS[y].length-LABELS[x].length);
 txt.split(/\n/).forEach(l=>{l=l.replace(/^[\s•*\-]+/,'').trim();for(const id of ids){const lb=LABELS[id]+':';if(l.startsWith(lb)){const v=l.slice(lb.length).trim();if(!v)break;a[id]=qs[id]&&qs[id].type==='checks'?v.split(/,\s*/):v;break}}});
 return Object.keys(a).length>1?a:null}
function parseVoz(txt){const m=txt.match(/PREFER[ÊE]NCIAS DA CLIENTE\s*[—-]\s*(.+)/i);if(!m)return null;const f=(txt.match(/WhatsApp:\s*(.+)/)||[])[1]||'';const i=txt.search(/Em palavras da cliente:/i);const texto=i>-1?txt.slice(i).replace(/Em palavras da cliente:\s*/i,'').trim():txt.trim();return {nome:m[1].trim(),fone:f.trim(),texto}}
function newCli(o){const h=Object.assign({id:uid(),cliente:'Nova cliente',phone:'',nasc:'',cob:'avulso',mensal:0,fixSvcs:[],fixPrice:0,sched:[],pkgs:[],prefs:{},notes:''},o);S.clients.push(h);return h}
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.f)return;e.preventDefault();const fd=new FormData(f);const F=Object.fromEntries(fd.entries());const k=f.dataset.f;
 if(k==='cli'){if(!String(F.cliente||'').trim()){feedback('Escreva o nome da cliente.',true);return}
  let h=f.dataset.h?cli(f.dataset.h):null;const days={};let miss=false;[0,1,2,3,4,5,6].forEach(d=>{if(F['d'+d]){if(F['t'+d])days[d]=F['t'+d];else miss=true}});
  if(miss){feedback('Coloque o horário do dia marcado.',true);return}
  const fs=fd.getAll('fsvc');if(Object.keys(days).length&&!fs.length){feedback('Escolha o serviço do horário fixo.',true);return}
  const from=F.from||today();const ns={from,freq:F.freq||'semanal',days,wk:parseInt(F.wk)||1};
  if(!h)h=newCli({});
  Object.assign(h,{cliente:F.cliente.trim(),phone:F.phone||'',nasc:F.nasc||'',cob:F.cob||'avulso',mensal:num(F.mensal),fixSvcs:fs});
  const cur=schedFor(h,from);if(!cur||JSON.stringify(cur.days)!==JSON.stringify(days)||cur.freq!==ns.freq||(ns.freq==='mensal'&&cur.wk!==ns.wk)){h.sched=(h.sched||[]).filter(x=>x.from<from);if(Object.keys(days).length||h.sched.length)h.sched.push(ns)}
  save();feedback('Cliente salva ✓');go('ficha',h.id)}
 else if(k==='novo'){const ids=fd.getAll('svc');if(!ids.length){feedback('Escolha pelo menos um serviço.',true);return}if(!F.time){feedback('Escolha o horário.',true);return}
  let h;if(!F.cli){feedback('Escolha a cliente.',true);return}if(F.cli==='__new'){if(!String(F.nome||'').trim()){feedback('Escreva o nome da cliente nova.',true);f.elements.nome.focus();return}if(!PLUS()&&S.clients.length>=LIMIT_BASICO){closeModal();A.lockinfo();return}h=newCli({cliente:F.nome.trim(),phone:F.fone||''})}else h=cli(F.cli);
  const mode=F.mode||'avulso';const price=mode==='avulso'?num(F.price):0;const step=parseInt(F.rep)||0;const n=step?parseInt(F.vezes)||1:1;let warn='';
  for(let i=0;i<n;i++){const date=addDays(F.date,step*i);const c=clash(date,F.time,svcDur(ids));if(c&&!warn)warn=' Atenção: bate com '+first(cli(c.cli).cliente)+' em '+fmtShort(date)+' às '+c.time+'.';S.extras.push({id:uid(),cli:h.id,date,time:F.time,svcs:ids,price,mode,kind:'avulso',st:''})}
  save();closeModal();agDate=F.date;feedback((n>1?n+' horários marcados ✓':'Horário marcado ✓')+warn,!!warn);render();
  if(PLUS()&&h.phone)setTimeout(()=>openModal(`<h3>Marcado ✓</h3><p>${esc(first(h.cliente))} · ${esc(fmtD(F.date))} às ${esc(F.time)}${n>1?' (e mais '+(n-1)+')':''}</p><a class="btn full" href="${esc(waLink(h.phone,fillTpl('confirma',h,{quando:fmtD(F.date)+' às '+F.time,servico:svcNames(ids)})))}" target="_blank" rel="noopener">📲 Mandar confirmação</a><button class="white full" data-a="close">Fechar</button>`),50)}
 else if(k==='remarcar'){const id=f.dataset.v;const v=getV(id);if(!v||!F.time){feedback('Escolha o novo horário.',true);return}
  const c=clash(F.date,F.time,svcDur(v.svcs),id);
  const isExtra=S.extras.some(x=>x.id===id);
  if(isExtra&&!v.st){v.date=F.date;v.time=F.time;v.remarc=1;save()}
  else{const nx={id:uid(),cli:v.cli,date:F.date,time:F.time,svcs:v.svcs,price:v.price,mode:v.mode,kind:'remarcada',from:id,st:''};S.extras.push(nx);
   if(pending(v))patch(id,{rep:nx.id,to:{date:F.date,time:F.time}});else patch(id,{st:'remarcada',to:{date:F.date,time:F.time}})}
  save();closeModal();render();const h=cli(v.cli);feedback('Remarcado para '+fmtD(F.date)+' às '+F.time+(c?' · atenção: bate com '+first(cli(c.cli).cliente):''),!!c);
  setTimeout(()=>openModal(`<h3>Remarcado ✓</h3><p><b>${esc(first(h.cliente))}</b><br>${esc(fmtD(F.date))} às ${esc(F.time)}<br><span class="small muted">${esc(svcNames(v.svcs))}</span></p>${h.phone?`<a class="btn full" href="${esc(waLink(h.phone,fillTpl('remarcado',h,{quando:fmtD(F.date)+' às '+F.time,servico:svcNames(v.svcs)})))}" target="_blank" rel="noopener">📲 Avisar a cliente no WhatsApp</a>`:''}<button class="white full" data-a="close">Fechar</button>`),50)}
 else if(k==='vender'){const h=cli(f.dataset.h);const p={id:uid(),name:(F.name||'Pacote').trim(),sessions:parseInt(F.sessions)||1,price:num(F.price),date:F.date||today()};h.pkgs=h.pkgs||[];h.pkgs.push(p);
  if(F.pago)S.payments.push({id:uid(),cli:h.id,month:ymOf(p.date),value:p.price,date:p.date,method:F.method,note:p.name});if(F.cob)h.cob='pacote';save();closeModal();feedback('Pacote salvo ✓');render()}
 else if(k==='pagar'){S.payments.push({id:uid(),cli:f.dataset.h,month:f.dataset.m,value:num(F.value),date:F.date||today(),method:F.method});save();closeModal();feedback('Pagamento salvo ✓');render()}
 else if(k==='colar'){const txt=F.txt||'';const ans=parseAnswers(txt);const vz=ans?null:parseVoz(txt);let h=f.dataset.h?cli(f.dataset.h):null;
  if(!h){if(!PLUS()&&S.clients.length>=LIMIT_BASICO){closeModal();A.lockinfo();return}const nm=(ans&&aval(ans,'cliente'))||(vz&&vz.nome)||'Nova cliente';h=newCli({cliente:nm,phone:(ans&&aval(ans,'fone'))||(vz&&vz.fone)||''})}
  if(ans){h.prefs=ans;delete h.prefsText;if(!h.phone&&aval(ans,'fone'))h.phone=aval(ans,'fone');if(!h.nasc&&aval(ans,'nasc'))h.nasc=aval(ans,'nasc').slice(0,5)}else{h.prefsText=vz?vz.texto:txt.trim();h.prefs={};if(vz&&vz.fone&&!h.phone)h.phone=vz.fone}h.prefsDate=new Date().toLocaleDateString('pt-BR');save();closeModal();feedback(ans?'Ficha guardada ✓':'Texto guardado na ficha ✓');go('ficha',h.id)}
 else if(k==='cad'){const c=parseCad(F.txt||'');const hf=document.querySelector('form[data-f=cli]');closeModal();if(!hf||!c){feedback('Não reconheci a resposta. Confira se ela usou a mensagem.',true);return}
  const set=(n,v)=>{if(v&&hf.elements[n])hf.elements[n].value=v};set('cliente',c.nome);set('phone',c.fone);set('nasc',c.nasc);
  c.dias.forEach(d=>{hf.elements['d'+d].checked=true;if(c.hora)hf.elements['t'+d].value=c.hora});
  if(c.svc){const t=c.svc.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();hf.querySelectorAll('input[name=fsvc]').forEach(x=>{const n=((svc(x.value)||{}).name||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();if(n&&t.includes(n))x.checked=true})}
  feedback('Preenchido! Confira e toque em Salvar cliente.');hf.scrollIntoView({behavior:'smooth'})}
 else if(k==='pro'){S.pro={name:(F.name||'').trim(),phone:(F.phone||'').trim()};if(String(S.pro.phone).replace(/\D/g,'').length<10){feedback('Confira o WhatsApp: DDD + número.',true);return}save();feedback('Link pronto ✓');render()}
 else if(k==='svc'){const x=svc(f.dataset.x);x.name=F.name;x.price=num(F.price);x.dur=parseInt(F.dur)||30;save();feedback('Serviço salvo ✓');render()}
